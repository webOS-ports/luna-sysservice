<?xml version="1.0"?>
<!-- Macros cppcheck cannot see without the sysroot's headers; without them
     it gives up on every file that includes Utils.h or uses timercmp(). -->
<def format="2">
  <define name="G_GNUC_PRINTF(format_idx,arg_idx)" value=""/>
  <define name="timercmp(a,b,CMP)" value="(((a)->tv_sec == (b)->tv_sec) ? ((a)->tv_usec CMP (b)->tv_usec) : ((a)->tv_sec CMP (b)->tv_sec))"/>
</def>
